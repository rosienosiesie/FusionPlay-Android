[package]
name = "fusionplay-miplay-sdk"
version = "1.0.4"
edition = "2024"
license = "AGPL-3.0-only"
description = "Self-contained, cross-platform Xiaomi MiPlay audio receiver SDK"

[lib]
name = "fusionplay_miplay_sdk"
crate-type = ["rlib"]

[dependencies]
aes = "0.9"
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.2", features = ["alloc"] }
hex = "0.4"
hmac = "0.12"
hkdf = "0.12"
if-addrs = { path = "../FusionPlay.AndroidIfAddrs" }
md-5 = "0.10"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdh"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
symphonia = { version = "0.6", default-features = false, features = ["aac"] }

[target.'cfg(target_os = "android")'.dependencies]
oboe = "0.6.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
] }
